<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — AXIOM</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;}
  .login-card{width:100%;max-width:380px;background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--card-radius);
    padding:34px 32px;box-shadow:var(--shadow-lg);}
  .login-brand{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
  .login-title{font-family:var(--font-display);font-weight:800;font-size:1.3rem;margin:0;color:var(--ink);}
  .login-sub{font-size:0.82rem;color:var(--muted);margin-top:2px;}
  .login-field{margin-bottom:16px;}
  .login-field label{display:block;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.9px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .login-field input{width:100%;box-sizing:border-box;background:var(--surface-1);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:11px 13px;font-size:0.9rem;font-family:var(--font-body);}
  .login-field input:focus{outline:none;border-color:var(--accent);}
  .login-error{background:var(--red-bg);color:#F87171;border:1px solid rgba(239,68,68,0.35);border-radius:10px;
    padding:10px 13px;font-size:0.8rem;margin-bottom:16px;display:none;}
  .login-btn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#8B5CF6,#6D28D9);
    color:#fff;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:var(--font-body);}
  .login-btn:disabled{opacity:0.6;cursor:default;}
  .login-btn:hover:not(:disabled){background:linear-gradient(135deg,#A78BFA,#8B5CF6);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px;}
  .pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;
    color:var(--muted);padding:6px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
  .pw-toggle:hover{color:var(--ink);}
  .pw-toggle svg{width:18px;height:18px;}
  .pw-toggle .eye-off{display:none;}
  .pw-toggle.shown .eye{display:none;}
  .pw-toggle.shown .eye-off{display:block;}
</style>
</head>
<body>
<div class="bg-orbit-field" aria-hidden="true"></div>
<div class="bg-animated" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
<div class="login-shell">
  <div class="orbit-rings-bg" aria-hidden="true"><span class="r1"></span><span class="r2"></span><span class="r3"></span></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-orbit">
        <div class="orbit-ring"><span class="orbit-dot"></span></div>
        <div class="brand-mark"><span>L</span></div>
      </div>
      <div>
        <div class="login-title">AXIOM</div>
        <div class="login-sub">Sign in to continue</div>
      </div>
    </div>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="login-field">
        <label>Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" title="Show password">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script>
  // If already signed in, skip straight to the app.
  (async () => {
    const adding = new URLSearchParams(location.search).get('add') === '1';
    if (adding) {
      document.querySelector('.login-sub').textContent = 'Add another account';
      const back = document.createElement('a');
      back.href = 'index.html'; back.textContent = '← Back to dashboard';
      back.style.cssText = 'display:block;text-align:center;margin-top:14px;font-size:0.8rem;color:var(--muted);text-decoration:none;';
      document.querySelector('.login-card').appendChild(back);
      return;
    }
    const existing = await axGetSessionAndProfile();
    if (existing) window.location.href = 'index.html';
  })();

  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      await axSignIn(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
      window.location.href = 'index.html';
    } catch (err) {
      errBox.textContent = err.message || 'Could not sign in. Check your email and password.';
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  });
</script>
<script>
  (function(){
    var btn=document.getElementById('pwToggle'), inp=document.getElementById('loginPassword');
    btn.addEventListener('click',function(){
      var show=inp.type==='password';
      inp.type=show?'text':'password';
      btn.classList.toggle('shown',show);
      btn.setAttribute('aria-label',show?'Hide password':'Show password');
      btn.title=show?'Hide password':'Show password';
      inp.focus();
    });
  })();
</script>
</body>
</html>
