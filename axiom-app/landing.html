<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXIOM — Student Performance Tracker</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  html,body{height:100%;}
  body{overflow-x:hidden;}

  .hero-shell{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;
    background:
      radial-gradient(1100px 700px at 52% 30%, #4C2E8C 0%, #2C1B57 32%, #170D30 62%, #0D0619 100%);
  }
  .hero-vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(4,2,10,0.55) 100%);}

  .hero-decor{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .shard{position:absolute;filter:drop-shadow(0 10px 18px rgba(0,0,0,0.35));will-change:transform;}
  .shard.violet{background:linear-gradient(150deg,#B9A2F0,#7C5CC7);}
  .shard.violet-dark{background:linear-gradient(150deg,#6B4FA8,#3B2A6B);}
  .shard.lime{background:linear-gradient(150deg,#CFF37A,#9AE04E);}
  .s1{width:70px;height:70px;top:10%;left:4%;clip-path:polygon(20% 0,100% 15%,85% 100%,0 70%);animation:shardFloat1 22s ease-in-out infinite;}
  .s2{width:44px;height:44px;top:22%;left:28%;clip-path:polygon(0 30%,60% 0,100% 60%,40% 100%);animation:shardFloat2 18s ease-in-out infinite;}
  .s3{width:120px;height:120px;top:8%;right:6%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2A1B4D,#0D0619);animation:shardFloat3 26s ease-in-out infinite;}
  .s4{width:36px;height:36px;top:16%;right:16%;clip-path:polygon(50% 0,100% 40%,80% 100%,10% 90%);animation:shardFloat1 20s ease-in-out infinite;}
  .s5{width:56px;height:56px;bottom:16%;right:8%;clip-path:polygon(20% 0,100% 30%,80% 100%,0 80%);animation:shardFloat2 24s ease-in-out infinite;}
  .s6{width:80px;height:80px;bottom:8%;left:3%;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);animation:shardFloat3 28s ease-in-out infinite;}
  @keyframes shardFloat1{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(10px,-14px) rotate(6deg);}}
  @keyframes shardFloat2{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(-12px,10px) rotate(-5deg);}}
  @keyframes shardFloat3{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(8px,12px) rotate(4deg);}}
  @media (prefers-reduced-motion: reduce){.shard{animation:none;}}

  .hero-orb{position:absolute;top:9%;left:50%;transform:translateX(-50%);width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#D8CBF7 0%,#9E7FDE 32%,#5A3FA0 68%,#2A1B4D 100%);
    box-shadow:0 40px 90px rgba(60,30,120,0.55), inset 0 0 0 1px rgba(255,255,255,0.18);z-index:1;}
  .hero-orb::before{content:'';position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(115deg, transparent 42%, rgba(20,10,40,0.55) 46%, rgba(20,10,40,0.55) 58%, transparent 62%);}
  .hero-orb::after{content:'';position:absolute;top:14%;left:14%;width:22%;height:22%;border-radius:50%;
    background:rgba(255,255,255,0.5);filter:blur(6px);}

  .hero-nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding:26px 40px;gap:16px;flex-wrap:wrap;}
  .hero-brand{display:flex;align-items:center;gap:12px;}
  .hero-brand .brand-mark{width:34px;height:34px;border-radius:9px;}
  .hero-brand .brand-mark span{font-size:1rem;}
  .hero-wordmark{font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:#fff;letter-spacing:-0.01em;}
  .hero-wordmark small{display:block;font-family:var(--font-body);font-weight:500;font-size:0.68rem;
    color:rgba(255,255,255,0.6);letter-spacing:0.3px;}
  .hero-nav-actions{display:flex;align-items:center;gap:22px;}
  .hero-link{color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.88rem;font-weight:500;}
  .hero-link:hover{color:#fff;}
  .hero-pill-light{background:#F4F1FB;color:#2A1854;text-decoration:none;font-weight:700;font-size:0.85rem;
    padding:10px 18px;border-radius:999px;transition:transform .15s ease,box-shadow .15s ease;}
  .hero-pill-light:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,0.25);}

  .hero-main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:0 20px 48px;}
  .hero-title{font-family:var(--font-display);font-weight:800;color:#fff;letter-spacing:-0.02em;
    font-size:clamp(1.9rem,4.4vw,3.1rem);line-height:1.16;margin:0 0 34px;max-width:820px;text-wrap:balance;}
  .hero-cta{display:inline-flex;align-items:center;gap:14px;background:#150B2B;color:#fff;text-decoration:none;
    font-weight:700;font-size:0.95rem;padding:8px 8px 8px 24px;border-radius:999px;
    border:1px solid rgba(255,255,255,0.12);box-shadow:0 14px 34px rgba(0,0,0,0.4);
    transition:transform .15s ease,box-shadow .15s ease;}
  .hero-cta:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(0,0,0,0.5);}
  .hero-cta-arrow{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
    background:#F4F1FB;color:#2A1854;font-size:1.05rem;}
  .hero-credit{margin-top:26px;font-size:0.68rem;letter-spacing:1.6px;text-transform:uppercase;
    color:rgba(255,255,255,0.5);font-weight:600;}

  @media (max-width:640px){
    .hero-nav{padding:20px 20px;}
    .hero-orb{width:150px;height:150px;top:6%;}
    .hero-title{margin-top:70px;}
  }
</style>
</head>
<body>
<div class="hero-shell">
  <div class="hero-decor" aria-hidden="true">
    <span class="shard violet s1"></span>
    <span class="shard violet-dark s2"></span>
    <span class="s3"></span>
    <span class="shard violet s4"></span>
    <span class="shard violet-dark s5"></span>
    <span class="shard lime s6"></span>
  </div>
  <div class="hero-orb" aria-hidden="true"></div>
  <div class="hero-vignette" aria-hidden="true"></div>

  <nav class="hero-nav">
    <div class="hero-brand">
      <div class="brand-mark"><span>L</span></div>
      <div class="hero-wordmark">AXIOM<small>Student Performance Tracker</small></div>
    </div>
    <div class="hero-nav-actions">
      <a href="login.html" class="hero-link">Sign In</a>
      <a href="login.html" class="hero-pill-light">Get Started</a>
    </div>
  </nav>

  <main class="hero-main">
    <h1 class="hero-title">Know Every Student.<br>Track Every Trend.<br>Secure Their Future.</h1>
    <a href="login.html" class="hero-cta">
      <span>Launch Dashboard</span>
      <span class="hero-cta-arrow">→</span>
    </a>
    <div class="hero-credit">An idea by Muhammad Zaman Khan</div>
  </main>
</div>
</body>
</html>
